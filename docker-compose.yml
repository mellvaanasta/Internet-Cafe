services:
  php:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: netzone
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./netzone.sql:/docker-entrypoint-initdb.d/netzone.sql:ro

volumes:
  mysql_data:
